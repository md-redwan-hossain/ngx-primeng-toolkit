# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN required.
# Publish runs only on manual workflow_dispatch from main (no push/PR CD).
#
# One-time setup (any package maintainer on npmjs.com):
#   Package → Settings → Trusted Publisher → GitHub Actions
#   - Organization or user: saiful-70   (GitHub repo owner)
#   - Repository: ngx-primeng-toolkit
#   - Workflow filename: publish.yml
#   - Allowed actions: enable "npm publish"
# After OIDC works, remove the GitHub NPM_TOKEN secret and revoke old automation tokens.

name: Publish to NPM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run type check
        run: npm run type-check

      - name: Build package
        run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Resolve version and publish readiness
        id: version
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if [[ $COMMIT_MSG == *"[skip ci]"* ]] || [[ $COMMIT_MSG == *"chore: bump version"* ]]; then
            echo "Skipping publish for bump/skip-ci commit"
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "version-bumped=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Checked-out version: $CURRENT_VERSION"

          if npm view "ngx-primeng-toolkit@$CURRENT_VERSION" version >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION is already on npm — bumping"

            if [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]] || [[ $COMMIT_MSG == *"major:"* ]]; then
              echo "Bumping major version"
              npm version major --no-git-tag-version
            elif [[ $COMMIT_MSG == *"feat:"* ]] || [[ $COMMIT_MSG == *"feature:"* ]]; then
              echo "Bumping minor version"
              npm version minor --no-git-tag-version
            else
              # fix:/patch:/bug: and any other commit — must bump because version exists
              echo "Bumping patch version"
              npm version patch --no-git-tag-version
            fi

            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add package.json
            git commit -m "chore: bump version [skip ci]"
            git push origin main

            CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "version-bumped=true" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION is not on npm — publishing as-is"
            echo "version-bumped=false" >> $GITHUB_OUTPUT
          fi

          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "should-publish=true" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        if: steps.version.outputs.should-publish == 'true'
        run: npm publish

      - name: Create Git Tag
        if: steps.version.outputs.should-publish == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          VERSION="${{ steps.version.outputs.current-version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
